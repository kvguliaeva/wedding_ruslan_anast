<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f6f1" />
    <meta name="description" content="Свадебное приглашение Руслана и Анастасии. 26 июля 2026." />
    <title>Руслан & Анастасия | Приглашение</title>
    <style>
      :root {
        --paper: #fbfaf7;
        --ink: #111;
        --wine: #972b2a;
        --shadow: 0 22px 70px rgba(49, 33, 28, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
        background: #eee8df;
      }

      body {
        min-width: 320px;
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 20% 0%, rgba(151, 43, 42, 0.08), transparent 34rem),
          linear-gradient(90deg, #e9e1d5 0, #f8f6f1 24%, #f8f6f1 76%, #e4dbce 100%);
        font-family: Georgia, "Times New Roman", serif;
      }

      .page-shell {
        width: min(100%, 440px);
        margin: 0 auto;
        padding: clamp(0px, 2.2vw, 28px) clamp(0px, 1.8vw, 18px);
      }

      .invite {
        position: relative;
        width: 100%;
        overflow: hidden;
        background: var(--paper);
        box-shadow: var(--shadow);
      }

      .invite::before {
        content: "";
        display: block;
        width: 100%;
        padding-top: 1300.31746%;
      }

      .invite__image,
      .hotspots {
        position: absolute;
        inset: 0;
      }

      .invite__image {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: fill;
        background: url("assets/images/pdf-preview.jpg") center top / cover no-repeat;
      }

      .hotspot {
        position: absolute;
        z-index: 7;
        display: block;
        border: 0;
        border-radius: 2px;
        background: transparent;
        color: transparent;
        cursor: pointer;
        text-decoration: none;
        -webkit-tap-highlight-color: rgba(151, 43, 42, 0.25);
      }

      .hotspot:focus-visible {
        outline: 2px solid var(--wine);
        outline-offset: 3px;
        background: rgba(151, 43, 42, 0.1);
      }

      .scroll-down {
        left: 34%;
        top: 12.15%;
        width: 32%;
        height: 0.78%;
      }

      .map-link {
        left: 6.5%;
        top: 33.00%;
        width: 87%;
        height: 0.42%;
      }

      .phone-link {
        left: 20%;
        top: 78.35%;
        width: 60%;
        height: 2.35%;
      }

      .contact-link {
        left: 6.5%;
        top: 82.64%;
        width: 87%;
        height: 0.82%;
      }

      .rsvp-link {
        left: 6.5%;
        top: 94.19%;
        width: 87%;
        height: 0.86%;
      }

      .calendar-heart-mask {
        position: absolute;
        left: 19%;
        top: 17.85%;
        z-index: 4;
        width: 62%;
        height: 5.7%;
        background: var(--paper);
        opacity: 1;
        pointer-events: none;
        transition: opacity 1400ms ease;
        will-change: opacity;
      }

      .calendar-heart-mask.is-visible {
        opacity: 0;
      }

      .countdown {
        position: absolute;
        left: 8%;
        top: 70.08%;
        z-index: 5;
        width: 84%;
        opacity: 0;
        transform: translateY(44px);
        filter: blur(3px);
        transition:
          opacity 900ms ease,
          filter 900ms ease,
          transform 1100ms cubic-bezier(0.22, 1, 0.36, 1);
        will-change: opacity, filter, transform;
      }

      .countdown.is-visible {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }

      .countdown__grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0.5%;
        text-align: center;
      }

      .countdown__grid span {
        display: block;
        opacity: 0;
        transform: translateY(18px);
        transition:
          opacity 720ms ease,
          transform 860ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .countdown.is-visible .countdown__grid span {
        opacity: 1;
        transform: translateY(0);
      }

      .countdown.is-visible .countdown__grid span:nth-child(1) {
        transition-delay: 90ms;
      }

      .countdown.is-visible .countdown__grid span:nth-child(2) {
        transition-delay: 180ms;
      }

      .countdown.is-visible .countdown__grid span:nth-child(3) {
        transition-delay: 270ms;
      }

      .countdown.is-visible .countdown__grid span:nth-child(4) {
        transition-delay: 360ms;
      }

      .countdown__value {
        display: block;
        color: #050505;
        font-family: "Bodoni 72", "Bodoni 72 Display", "Didot", "Baskerville", Georgia, serif;
        font-size: clamp(34px, 11.4vw, 58px);
        font-weight: 400;
        font-variant-numeric: lining-nums tabular-nums;
        font-feature-settings: "lnum" 1, "tnum" 1;
        letter-spacing: 0;
        line-height: 0.82;
        text-rendering: geometricPrecision;
        text-shadow: 0 0 0 #050505;
      }

      .countdown__label {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      .modal {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 18px;
        background: rgba(18, 14, 12, 0.48);
      }

      .modal.is-open {
        display: flex;
      }

      .dialog {
        width: min(100%, 690px);
        max-height: min(88vh, 720px);
        overflow: auto;
        background: #fffdf9;
        border: 1px solid rgba(151, 43, 42, 0.45);
        box-shadow: 0 18px 70px rgba(0, 0, 0, 0.32);
        padding: 24px;
      }

      .dialog__top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 18px;
      }

      .dialog h2 {
        margin: 0;
        font-size: 34px;
        font-weight: 400;
        line-height: 0.95;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .dialog p {
        margin: 8px 0 0;
        font-family: "Courier New", monospace;
        font-size: 14px;
        line-height: 1.45;
      }

      .close {
        width: 38px;
        height: 38px;
        flex: 0 0 38px;
        border: 1px solid rgba(151, 43, 42, 0.55);
        background: #fff;
        color: var(--wine);
        font-size: 24px;
        line-height: 1;
        cursor: pointer;
      }

      .yandex-form {
        display: block;
        width: 100%;
        min-height: 560px;
        border: 0;
        background: #fff;
      }

      @media (max-width: 440px) {
        .page-shell {
          width: 100%;
        }

        .invite {
          box-shadow: none;
        }

        .dialog {
          padding: 20px;
        }

        .dialog h2 {
          font-size: 30px;
        }

        .countdown {
          left: 6%;
          width: 88%;
        }
      }

      @media (min-width: 900px) {
        .page-shell {
          width: 430px;
          padding-top: 32px;
          padding-bottom: 32px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        *,
        *::before,
        *::after {
          transition-duration: 1ms !important;
          animation-duration: 1ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page-shell" aria-label="Свадебное приглашение Руслана и Анастасии">
      <section class="invite" aria-label="Макет приглашения">
        <img
          class="invite__image"
          src="assets/images/pdf-source.jpg"
          width="1260"
          height="16384"
          alt="Свадебное приглашение Руслана и Анастасии: 26 июля 2026, парк-ресторан Нет на карте, Самарская область, городской округ Кинель, поселок Усть-Кинельский."
        />
        <div class="calendar-heart-mask" data-reveal></div>
        <div class="countdown" data-countdown aria-live="polite">
          <div class="countdown__grid">
            <span><b class="countdown__value" data-countdown-days>0</b><small class="countdown__label">Дней</small></span>
            <span><b class="countdown__value" data-countdown-hours>0</b><small class="countdown__label">Часов</small></span>
            <span><b class="countdown__value" data-countdown-minutes>0</b><small class="countdown__label">Минут</small></span>
            <span><b class="countdown__value" data-countdown-seconds>0</b><small class="countdown__label">Секунд</small></span>
          </div>
        </div>
        <div class="hotspots" aria-hidden="false">
          <button class="hotspot scroll-down" type="button" data-scroll-down aria-label="Листать вниз">Листай вниз</button>
          <a
            class="hotspot map-link"
            href="https://yandex.ru/maps/org/net_na_karte/179466847244/?ll=50.593422%2C53.260503&z=12"
            target="_blank"
            rel="noopener"
            aria-label="Открыть место проведения на Яндекс Картах"
          >Как добраться</a>
          <a class="hotspot phone-link" href="tel:+79523209036" aria-label="Позвонить организатору по номеру +7 952 320 90 36">
            +7 952 320 90 36
          </a>
          <a
            class="hotspot contact-link"
            href="https://t.me/radio_antonova"
            target="_blank"
            rel="noopener"
            aria-label="Написать организатору в Telegram"
          >Связаться</a>
          <button class="hotspot rsvp-link" type="button" data-open-rsvp aria-label="Открыть анкету гостя">Подтвердить</button>
        </div>
      </section>
    </main>

    <div class="modal" data-modal aria-hidden="true">
      <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="rsvp-title">
        <div class="dialog__top">
          <div>
            <h2 id="rsvp-title">Анкета гостя</h2>
            <p>Пожалуйста, подтвердите присутствие на свадьбе до 12 июля 2026.</p>
          </div>
          <button class="close" type="button" data-close-rsvp aria-label="Закрыть">×</button>
        </div>
        <script src="https://forms.yandex.ru/_static/embed.js"></script>
        <iframe
          class="yandex-form"
          src="https://forms.yandex.ru/u/6a0b1d6f02848f0a63b8cd18?iframe=1"
          frameborder="0"
          name="ya-form-6a0b1d6f02848f0a63b8cd18"
          width="650"
          title="Анкета гостя"
        ></iframe>
      </section>
    </div>

    <script>
      const modal = document.querySelector("[data-modal]");
      const openButton = document.querySelector("[data-open-rsvp]");
      const closeButton = document.querySelector("[data-close-rsvp]");
      const scrollDownButton = document.querySelector("[data-scroll-down]");
      const weddingDate = new Date("2026-07-26T16:00:00+04:00");
      const countdownNodes = {
        days: document.querySelector("[data-countdown-days]"),
        hours: document.querySelector("[data-countdown-hours]"),
        minutes: document.querySelector("[data-countdown-minutes]"),
        seconds: document.querySelector("[data-countdown-seconds]"),
      };

      function updateCountdown() {
        const distance = Math.max(0, weddingDate.getTime() - Date.now());
        const totalSeconds = Math.floor(distance / 1000);
        countdownNodes.days.textContent = Math.floor(totalSeconds / 86400);
        countdownNodes.hours.textContent = String(Math.floor((totalSeconds % 86400) / 3600)).padStart(2, "0");
        countdownNodes.minutes.textContent = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, "0");
        countdownNodes.seconds.textContent = String(totalSeconds % 60).padStart(2, "0");
      }

      function openModal() {
        modal.classList.add("is-open");
        modal.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
        closeButton.focus();
      }

      function closeModal() {
        modal.classList.remove("is-open");
        modal.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
        openButton.focus();
      }

      scrollDownButton.addEventListener("click", () => {
        window.scrollTo({
          top: Math.round(document.documentElement.scrollHeight * 0.155),
          behavior: "smooth",
        });
      });
      openButton.addEventListener("click", openModal);
      closeButton.addEventListener("click", closeModal);
      modal.addEventListener("click", (event) => {
        if (event.target === modal) closeModal();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && modal.classList.contains("is-open")) closeModal();
      });

      const revealObserver = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) entry.target.classList.add("is-visible");
          });
        },
        { threshold: 0.35 }
      );
      document.querySelectorAll("[data-reveal], [data-countdown]").forEach((node) => revealObserver.observe(node));

      updateCountdown();
      setInterval(updateCountdown, 1000);
    </script>
  </body>
</html>
